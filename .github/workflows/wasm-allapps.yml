# The all-apps browser page: Home and every app of the apps repository frozen
# into one WebAssembly runtime (scripts/build_wasm_allapps.py,
# docs/guides/build-the-all-apps-page.md). Run it by hand with the refs to
# build; it builds, checks the runtime starts and imports what Home needs, and
# uploads the page as the allapps-page artifact. From main it then publishes
# the page to https://apps.omnipython.org/ (this repository's GitHub Pages
# site), unless you untick "publish". A release of the apps repository sends
# an apps-release event, which builds that tag and publishes it.
name: All-apps browser page

on:
  workflow_dispatch:
    inputs:
      apps_ref:
        description: PyDevices/apps branch, tag or commit
        default: main
      omnipython_ref:
        description: PyDevices/omnipython branch, tag or commit
        default: main
      publish:
        description: Publish the page to apps.omnipython.org (from main only)
        type: boolean
        default: true
  repository_dispatch:
    types: [apps-release]

permissions:
  contents: read

concurrency:
  group: wasm-allapps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The webassembly port's dev container, as the WebAssembly runtime
      # workflow builds in: install.sh's packages, and emsdk fetched at its pin.
      - name: Build the page in the webassembly dev container
        uses: devcontainers/ci@v0.3
        env:
          APPS_REF: ${{ inputs.apps_ref || github.event.client_payload.apps_ref || 'main' }}
          OMNIPYTHON_REF: ${{ inputs.omnipython_ref || github.event.client_payload.omnipython_ref || 'main' }}
        with:
          configFile: .devcontainer/webassembly/devcontainer.json
          push: never
          env: |
            APPS_REF
            OMNIPYTHON_REF
          runCmd: |
            set -e
            ./scripts/build_wasm_allapps.py --apps-ref "$APPS_REF" --omnipython-ref "$OMNIPYTHON_REF" --out builds/allapps-page

      - name: It starts and imports what Home needs
        run: |
          cat > /tmp/check.py <<'EOF'
          import os, sys
          print(sys.implementation)
          for name in ("appkit", "touchkit", "deskkit", "vtterm", "frozen_apps", "frozen_apps.home", "frozen_apps.watch", "midiports.endpoints"):
              __import__(name)
              print("imports", name)
          assert hasattr(os, "dupterm"), "no os.dupterm"
          EOF
          node builds/allapps-page/micropython.mjs /tmp/check.py
          cat builds/allapps-page/allapps.json

      - uses: actions/upload-artifact@v7
        with:
          name: allapps-page
          path: builds/allapps-page
          if-no-files-found: error

      - name: Package the page for GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'repository_dispatch' || inputs.publish)
        uses: actions/upload-pages-artifact@v5
        with:
          path: builds/allapps-page

  # One deployment at a time; a newer one waits rather than cancelling this.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'repository_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: allapps-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
