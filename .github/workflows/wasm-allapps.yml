# The all-apps browser page: Home and every app of the apps repository frozen
# into one WebAssembly runtime (scripts/build_wasm_allapps.py,
# docs/guides/build-the-all-apps-page.md). Run it by hand with the refs to
# build; it builds, checks the runtime starts and imports what Home needs and
# that Object detection's page side works, and uploads the page as the
# allapps-page artifact. From main it then asks PyDevices/apps.omnipython.org
# to publish that artifact at https://apps.omnipython.org/, unless you untick
# "publish". A release of the apps repository sends an apps-release event,
# which builds that tag and publishes it. A pull request that changes the
# page's build, its variant or its tests runs it too, on apps and omnipython
# main, and publishes nothing.
name: All-apps browser page

on:
  pull_request:
    paths:
      - 'scripts/build_wasm_allapps.py'
      - 'variants/webassembly/allapps/**'
      - 'variants/webassembly/tests/detect.mjs'
      - 'DEPENDENCIES.lock'
      - '.github/workflows/wasm-allapps.yml'
  workflow_dispatch:
    inputs:
      apps_ref:
        description: PyDevices/apps branch, tag or commit
        default: main
      omnipython_ref:
        description: PyDevices/omnipython branch, tag or commit
        default: main
      publish:
        description: Publish the page to apps.omnipython.org (from main only)
        type: boolean
        default: true
  repository_dispatch:
    types: [apps-release]

permissions:
  contents: read

concurrency:
  group: wasm-allapps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The webassembly port's dev container, as the WebAssembly runtime
      # workflow builds in: install.sh's packages, and emsdk fetched at its pin.
      - name: Build the page in the webassembly dev container
        uses: devcontainers/ci@v0.3
        env:
          APPS_REF: ${{ inputs.apps_ref || github.event.client_payload.apps_ref || 'main' }}
          OMNIPYTHON_REF: ${{ inputs.omnipython_ref || github.event.client_payload.omnipython_ref || 'main' }}
        with:
          configFile: .devcontainer/webassembly/devcontainer.json
          push: never
          env: |
            APPS_REF
            OMNIPYTHON_REF
          runCmd: |
            set -e
            ./scripts/build_wasm_allapps.py --apps-ref "$APPS_REF" --omnipython-ref "$OMNIPYTHON_REF" --out builds/allapps-page

      - name: It starts and imports what Home needs
        run: |
          cat > /tmp/check.py <<'EOF'
          import os, sys
          print(sys.implementation)
          for name in ("appkit", "touchkit", "deskkit", "vtterm", "frozen_apps", "frozen_apps.home", "frozen_apps.watch", "midiports.endpoints"):
              __import__(name)
              print("imports", name)
          assert hasattr(os, "dupterm"), "no os.dupterm"
          EOF
          node builds/allapps-page/micropython.mjs /tmp/check.py
          cat builds/allapps-page/allapps.json

      - name: Object detection's page side works
        run: node variants/webassembly/tests/detect.mjs builds/allapps-page

      - uses: actions/upload-artifact@v7
        with:
          name: allapps-page
          path: builds/allapps-page
          if-no-files-found: error

  # apps.omnipython.org is the GitHub Pages site of PyDevices/apps.omnipython.org,
  # whose publish workflow takes this run's allapps-page artifact and deploys
  # it. This job tells it which run to take.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'repository_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Mint an installation token for the site's repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}
          owner: PyDevices
          repositories: apps.omnipython.org

      - name: Ask apps.omnipython.org to publish this run's page
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method POST repos/PyDevices/apps.omnipython.org/dispatches \
            -f event_type=allapps-built \
            -f "client_payload[run_id]=$RUN_ID"
          echo "asked apps.omnipython.org to publish run $RUN_ID"
