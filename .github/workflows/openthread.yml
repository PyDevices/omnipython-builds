# openthread from a bare clone: an ESP32-S31 firmware with the module, built
# as a release would (ESP-IDF 6.1 at its DEPENDENCIES.lock pin, under the
# esp32 port's -Werror=all), and a check that the Thread stack and the
# module's calls into it were linked.
name: openthread

on:
  push:
    branches: [main]
    paths:
      - 'modules/openthread/**'
      - '!modules/openthread/*.md'
      - '!modules/openthread/*.pyi'
      - 'patches/micropython-s31/**'
      - 'patches/esp-idf6/**'
      - 'tests/test_build_mp.py'
      - 'build_mp.py'
      - 'scripts/pins.py'
      - '.github/workflows/openthread.yml'
  pull_request:
    paths:
      - 'modules/openthread/**'
      - '!modules/openthread/*.md'
      - '!modules/openthread/*.pyi'
      - 'patches/micropython-s31/**'
      - 'patches/esp-idf6/**'
      - 'tests/test_build_mp.py'
      - 'build_mp.py'
      - 'scripts/pins.py'
      - '.github/workflows/openthread.yml'
  # Everything, weekly: the path filters skip what a change can't reach.
  schedule:
    - cron: '35 7 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. A push to main is
# never cancelled: each one keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  esp32s31:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_ASM_COMPILER_LAUNCHER: ccache
      IDF_CCACHE_ENABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Packages the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext cmake ninja-build pkg-config libffi-dev

      - name: The runner's Python, which the cached venvs are tied to
        id: py
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      - name: The toolchain pins, which the cached deps/ is tied to
        id: toolchains
        run: echo "key=$(python3 scripts/pins.py --key toolchains)" >> "$GITHUB_OUTPUT"

      - name: Cache ESP-IDF 6.1
        uses: actions/cache@v6
        with:
          path: |
            deps/esp-idf6
            ~/.espressif
          key: deps-idf6-py${{ steps.py.outputs.version }}-${{ steps.toolchains.outputs.key }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-openthread-s31-${{ hashFiles('DEPENDENCIES.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-openthread-s31-${{ hashFiles('DEPENDENCIES.lock') }}-
            ccache-openthread-s31-

      - name: Build an ESP32-S31 firmware with openthread
        run: python3 build_mp.py --port esp32 --board ESP32_GENERIC_S31 --variant ZERO --flash 32MB --modules openthread

      - name: The Thread stack and the module's calls into it are linked
        run: |
          map=$(ls builds/esp32/ESP32_GENERIC_S31/ZERO/micropython.map)
          grep -q 'mod_openthread.c.obj' "$map"
          grep -q 'esp_openthread_start' "$map"
          grep -q 'otThreadDiscover' "$map"
          grep -q 'otUdpSend' "$map"
          grep -q 'esp_ieee802154' "$map"

      - name: The 802.15.4 MAC attaches to sleep retention only where its entries are built
        run: PYTHONPATH=tests python3 -m unittest test_build_mp.Ieee802154Retention -v
