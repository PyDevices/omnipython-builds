# ttfio from a bare clone on the unix port: the API test, then FreeType's
# unhinted drawing of the same icons beside ttfio's, then the icons package
# frozen on top of it, from omnipython-lib at its pinned commit. The second job
# runs the same ttfio and icons checks on CircuitPython's unix port, and the
# third builds both into CircuitPython for an ESP32-S3 board, whose port turns
# warnings the unix port allows into errors.
name: ttfio

on:
  push:
    branches: [main]
    paths:
      - 'modules/ttfio/**'
      - '!modules/ttfio/*.md'
      - 'modules/icons/**'
      - 'build_mp.py'
      - 'scripts/pins.py'
      - '.github/workflows/ttfio.yml'
  pull_request:
    paths:
      - 'modules/ttfio/**'
      - '!modules/ttfio/*.md'
      - 'modules/icons/**'
      - 'build_mp.py'
      - 'scripts/pins.py'
      - '.github/workflows/ttfio.yml'
  # Everything, weekly: the path filters skip what a change can't reach.
  schedule:
    - cron: '55 6 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. A push to main is
# never cancelled: each one keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the unix port's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Build the unix port with ttfio and icons
        run: python3 build_mp.py --port unix --modules ttfio,icons

      - name: The API, its errors, and drawing without allocating
        run: |
          mkdir -p ttfout
          timeout 120 ./builds/unix/standard/micropython modules/ttfio/tests/test_ttfio.py --out ttfout

      - name: The same icons as FreeType draws them
        run: |
          python3 -m pip install numpy freetype-py
          python3 modules/ttfio/tests/check_ttfio_freetype.py ttfout

      - name: icons draws every icon, frozen
        run: timeout 300 ./builds/unix/standard/micropython modules/.omnipython-lib/packages/icons/tests/run.py

  circuitpython:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the unix port's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Build CircuitPython's unix port with ttfio and icons
        run: python3 build_mp.py --interpreter circuitpython --port unix --modules ttfio,icons

      - name: The API, its errors, and drawing without allocating
        run: timeout 120 ./builds/circuitpython/unix/coverage/micropython modules/ttfio/tests/test_ttfio.py

      - name: icons draws every icon, frozen
        run: timeout 300 ./builds/circuitpython/unix/coverage/micropython modules/.omnipython-lib/packages/icons/tests/run.py

  # ttfio's C compiled by CircuitPython's espressif port, which builds with
  # -Werror=float-equal, double-promotion and cast-align, and the icons package
  # frozen into the image. The unix job doesn't see those warnings.
  circuitpython-esp32s3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_ASM_COMPILER_LAUNCHER: ccache
      IDF_CCACHE_ENABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Packages the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext cmake ninja-build pkg-config libffi-dev

      - name: The runner's Python, which the cached venvs are tied to
        id: py
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      - name: The toolchain pins, which the cached deps/ is tied to
        id: toolchains
        run: echo "key=$(python3 scripts/pins.py --key toolchains)" >> "$GITHUB_OUTPUT"

      - name: Cache the toolchains
        uses: actions/cache@v6
        with:
          path: |
            deps/circuitpython
            deps/circuitpython-venv
            ~/.espressif
          key: deps-cp-esp32s3-py${{ steps.py.outputs.version }}-${{ steps.toolchains.outputs.key }}-${{ hashFiles('patches/circuitpython/**') }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-cp-esp32s3-ttfio-${{ hashFiles('DEPENDENCIES.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-cp-esp32s3-ttfio-${{ hashFiles('DEPENDENCIES.lock') }}-
            ccache-cp-esp32s3-ttfio-

      - name: Build CircuitPython for the ESP32-S3-Touch-LCD-4.3 with ttfio and icons
        run: |
          python3 build_mp.py --interpreter circuitpython --port espressif \
            --board waveshare_esp32s3_touch_lcd_43 --modules ttfio,icons

      - name: ttfio is linked and icons is frozen in the image
        run: |
          out=builds/circuitpython/espressif/waveshare_esp32s3_touch_lcd_43
          test -s "$out/firmware.bin"
          for o in mod_ttfio ttfio_core; do
            grep -q "/$o.o" "$out/firmware.objs" || { echo "$o.o was not linked"; exit 1; }
          done
          grep -aq "icons/__init__.py" "$out/firmware.elf" || { echo "icons is not frozen in the image"; exit 1; }
