<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniPython apps</title>
<meta name="description" content="Home and every app, frozen into one MicroPython build that runs in the browser.">
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { height: 100%; margin: 0; background: #111; color: #ddd; font: 16px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; width: min(100vw, calc(100vh * 800 / 480)); aspect-ratio: 800 / 480; touch-action: none; outline: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px; background: #222; font-size: 14px; }
  #status[hidden], #update[hidden] { display: none; }
  #update { position: fixed; top: 8px; right: 8px; padding: 8px 12px; background: #0b2a4a; color: #fff; border-radius: 6px; font-size: 14px; }
  #update button { margin-left: 8px; font: inherit; }
</style>
</head>
<body>
<canvas id="display_canvas" width="800" height="480" tabindex="0"></canvas>
<div id="status">Loading...</div>
<div id="update" hidden>A new version is ready.<button type="button">Reload</button></div>
<script type="module">
// Everything Home and its apps import is frozen into micropython.wasm, so the
// page fetches nothing but these two files. Query parameters: ?width= and
// ?height= size the screen (800x480 by default); ?app= starts in an app, as
// a restart into one does. ?home=watch boots Watch as the home screen instead
// of Home, as a round or small board does, and ?round=1 makes the screen a
// round one, as a round panel's board config says.
const $ = (id) => document.getElementById(id);
const state = { phase: "loading", log: [] };
window.__allapps = state;
const params = new URLSearchParams(location.search);
const width = parseInt(params.get("width") || "800", 10);
const height = parseInt(params.get("height") || "480", 10);
// An app's name: letters, digits and underscores, nothing else reaches Python.
const home = /^[a-z0-9_]+$/.test(params.get("home") || "") ? params.get("home") : "home";
const round = params.get("round") === "1";
state.home = home;
const canvas = $("display_canvas");
canvas.width = width;
canvas.height = height;
canvas.style.aspectRatio = `${width} / ${height}`;
canvas.style.width = `min(100vw, calc(100vh * ${width} / ${height}))`;
canvas.focus();
const log = (line) => { state.log.push(line); console.log(line); };
// Web Audio starts only after a gesture: the first tap or key unlocks it.
const unlock = () => {
  globalThis.Module?.omnipythonBridge?.enableAudio(false)?.then(() => {
    removeEventListener("pointerdown", unlock);
    removeEventListener("keydown", unlock);
  }).catch(() => {});
};
addEventListener("pointerdown", unlock);
addEventListener("keydown", unlock);
async function boot() {
  const { loadMicroPython } = await import("./micropython.mjs");
  const mp = await loadMicroPython({ heapsize: 64 * 1024 * 1024, pystack: 16 * 1024, stdout: log, stderr: log, linebuffer: true });
  window.mp = mp;
  state.phase = "booting";
  $("status").hidden = true;
  // What Home's main.py does on a board, starting with a script app Home
  // restarted into: it runs on its own timers, and Home comes back when it quits.
  await mp.runPythonAsync(`
import os, sys
os.chdir("/")
from boarddev import env_set
env_set("OMNIPYTHON_WIDTH", ${width})
env_set("OMNIPYTHON_HEIGHT", ${height})
env_set("OMNIPYTHON_SCALE", 1)
env_set("OMNIPYTHON_TZ_OFFSET_MIN", ${JSON.stringify(String(new Date().getTimezoneOffset()))})
import appkit
script = appkit.run_pending_script()
`);
  if (mp.globals.get("script")) {
    state.phase = "script";
    return;
  }
  await mp.runPythonAsync(`
if ${round ? "True" : "False"}:
    import board_config
    board_config.display_drv.round = True
from display_driver import app
from touchkit import shell
shell.quiet_app_timers(app)
launcher = shell.TouchLauncher(app, home="home")
launcher.scan("apps")
if ${JSON.stringify(home)} in launcher.names:
    launcher.home = ${JSON.stringify(home)}
else:
    print("allapps: no app called %r, so Home is the home screen" % (${JSON.stringify(home)},))
launcher.shell = shell.TouchShell(launcher)
shell.launcher = launcher
launcher.boot(launcher.home)
`);
  state.phase = "running";
  // Returns when an app ends the main loop: REPL does, so the REPL can run.
  await mp.runPythonAsync("appkit.serve()");
  state.phase = "served";
}
// The service worker (sw.js) keeps the page for offline use. A new build
// installs beside the one running; it takes over when every window of the page
// closes, or now if you choose Reload.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then((reg) => {
    const offer = (worker) => {
      $("update").hidden = false;
      $("update").querySelector("button").onclick = () => { state.updating = true; worker.postMessage("update"); };
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const worker = reg.installing;
      worker.addEventListener("statechange", () => {
        if (worker.state === "installed" && navigator.serviceWorker.controller) offer(worker);
      });
    });
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (state.updating && !reloading) { reloading = true; location.reload(); }
    });
  }).catch((error) => log("allapps: no service worker: " + error));
}
boot().catch((error) => {
  state.phase = "failed";
  state.error = String(error && (error.stack || error));
  $("status").hidden = false;
  $("status").textContent = "Stopped: " + error;
  console.error(error);
});
</script>
</body>
</html>
